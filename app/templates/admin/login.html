<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin</title><style>body{font:14px system-ui;background:#f1f5f9;display:grid;place-items:center;min-height:100vh}.box{background:white;padding:28px;border-radius:14px;width:min(380px,90vw);box-shadow:0 12px 35px #0f172a20}input{box-sizing:border-box;width:100%;padding:11px;margin:6px 0 14px;border:1px solid #cbd5e1;border-radius:8px}button{width:100%;padding:11px;background:#2563eb;color:white;border:0;border-radius:8px}.error{color:#b91c1c}</style></head><body><form class="box" method="post"><h1>NST Repair Admin</h1><p>Masuk untuk mengelola hasil diagnosis dan model.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="{{ category }}">{{ message }}</p>{% endfor %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ identity_label }}</label><input name="username" {% if 'Email' in identity_label %}type="email" autocomplete="email"{% else %}autocomplete="username"{% endif %} required autofocus><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Masuk</button></form></body></html>
